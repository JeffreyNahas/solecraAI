# Posts pull request progress on the issues it closes, so issues show real-time status
# without anyone updating them by hand.
name: Issue sync

on:
  pull_request:
    types: [opened, ready_for_review, converted_to_draft, closed, reopened]

permissions:
  issues: write
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const action = context.payload.action;
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|part of)\s+#(\d+)/gi;
            const issues = [...new Set([...(pr.body || "").matchAll(re)].map(m => Number(m[1])))];
            if (!issues.length) {
              core.notice("No linked issue (use 'Closes #N' in the PR description).");
              return;
            }
            let status;
            if (action === "closed") {
              status = pr.merged ? `✅ Merged: #${pr.number}` : `⏹️ PR #${pr.number} closed without merging`;
            } else if (action === "ready_for_review") {
              status = `👀 Ready for review: #${pr.number}`;
            } else if (action === "converted_to_draft") {
              status = `🔧 Back in progress: #${pr.number}`;
            } else {
              status = pr.draft ? `🔧 In progress: #${pr.number}` : `👀 Ready for review: #${pr.number}`;
            }
            for (const issue_number of issues) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number,
                body: `${status} — ${pr.title}`,
              });
            }
