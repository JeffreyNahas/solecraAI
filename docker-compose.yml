# Local dev:   docker compose up --build
# Server:      docker compose --profile prod up -d --build   (adds Caddy for HTTPS)
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solecra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-solecra}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # reachable from this machine only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-solecra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-solecra}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000" # cloudflared (dev) or Caddy (prod) sits in front
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-solecra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-solecra}
    depends_on:
      api:
        condition: service_healthy # api runs the migrations on start

  caddy:
    image: caddy:2
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      BOT_DOMAIN: ${BOT_DOMAIN:?set BOT_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
